name: Ordinary GUI microphone to IME on Android x86_64
on:
  push:
    branches: [qa/fourier-external-emulator]
permissions:
  contents: read
jobs:
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare an isolated virtual microphone and external UI controller
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio pulseaudio-utils espeak
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=fourier_fixture
          pactl load-module module-null-sink sink_name=quiet_output
          pactl set-default-sink quiet_output
          pactl set-default-source fourier_fixture.monitor
          pactl list short sources
          npm install -g appium@3
          appium driver install uiautomator2
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the ordinary app and a separate native editor
        run: |
          cd src/flutter/local_whisper
          flutter pub get
          flutter test --reporter expanded test/onboarding_download_test.dart test/models_test.dart
          flutter build apk --release --target-platform android-x64 --target lib/main.dart
          apk=build/app/outputs/flutter-apk/app-release.apk
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-entries"
          for lib in libapp.so libflutter.so libsherpa-onnx-c-api.so libonnxruntime.so; do
            grep -Fx "lib/x86_64/$lib" "$RUNNER_TEMP/apk-entries"
          done
          cd "$GITHUB_WORKSPACE"
          bash .github/fourier-review/build-editor.sh
      - name: Test microphone, history and cross-app keyboard through visible controls
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PULSE_SOURCE: fourier_fixture.monitor
          PULSE_SINK: quiet_output
          QEMU_AUDIO_DRV: pa
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 6144M
          disk-size: 8192M
          heap-size: 768M
          cores: 3
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -allow-host-audio
          script: bash .github/fourier-review/run-external.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-readback-screenshots-and-log
          path: ${{ runner.temp }}/fourier-ui
          retention-days: 7
